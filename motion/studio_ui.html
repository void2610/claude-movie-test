<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>motion studio</title>
<style>
:root{
  --bg:#0d0e11;--panel:#15161b;--panel2:#1c1d23;--line:#2a2c34;--fg:#e6e6ea;--dim:#8b8d97;--faint:#5a5c66;
  --acc:#ff6a33;--sel:#4da3ff;--selbg:#1d2b40;--cue:#ff9a5c;--note:#facc15;--err:#ff5470;--ok:#4ade80;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;--row:22px;--left:250px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 -apple-system,"Hiragino Sans",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--dim)}button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:#140904;font-weight:600}
button.sm{font-size:11px;padding:2px 8px}
button.ghost{background:none;border-color:transparent;color:var(--dim)}button.ghost:hover{color:var(--fg);border-color:var(--line)}
#app{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-rows:44px minmax(0,1fr) var(--tlh,340px);height:100%}
header{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line)}
header .name{font-weight:700}header .meta{color:var(--dim);font-family:var(--mono);font-size:12px}
header .sp{flex:1}
#job{font-family:var(--mono);font-size:12px;color:var(--dim);max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#job.run{color:var(--note)}#job.bad{color:var(--err)}#job.good{color:var(--ok)}
#stage{position:relative;background:#050506;min-height:0;overflow:hidden}
#stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
#ov{position:absolute;inset:0;width:100%;height:100%}
#err{position:absolute;inset:0;background:#1a0709ee;color:#ff9aa8;white-space:pre-wrap;font-family:var(--mono);font-size:12px;padding:18px;overflow:auto;display:none;z-index:3}
#cache{position:absolute;left:0;bottom:0;height:2px;background:var(--acc);width:0;z-index:2}
#busy{position:absolute;right:10px;top:10px;font-family:var(--mono);font-size:11px;color:var(--note);display:none;z-index:2}
#hint{position:absolute;left:10px;bottom:10px;font-size:11px;color:var(--faint);z-index:2;pointer-events:none}
aside{grid-row:2;grid-column:2;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:10px 0;color:var(--dim)}
.tabs button.on{color:var(--fg);box-shadow:inset 0 -2px 0 var(--acc)}
.tabs .badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--line);font-size:11px;margin-left:4px}
.tabs .badge.err{background:var(--err);color:#fff}
.pane{flex:1;overflow:auto;padding:12px 14px;display:none}.pane.on{display:block}
h4{margin:14px 0 6px;font-size:11px;letter-spacing:.06em;color:var(--dim);font-weight:600}
h4:first-child{margin-top:0}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-bottom:4px;font-size:12px}
.crumbs a{color:var(--dim);cursor:pointer;padding:1px 4px;border-radius:4px}.crumbs a:hover{background:var(--panel2);color:var(--fg)}
.crumbs .sep{color:var(--faint)}
.sel-title{font-weight:700;font-size:16px;margin:2px 0 0}.sel-id{font-family:var(--mono);font-size:11px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{font-size:11px;padding:2px 9px;border-radius:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld span{font-size:11px;color:var(--dim)}
.fld input[type=number],.fld input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:4px 6px;font-family:var(--mono);font-size:12px}
.fld.changed span{color:var(--acc)}
.prop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;padding:8px 0;border-bottom:1px solid var(--line)}
.prop label{font-family:var(--mono);font-size:12px}.prop.changed label::after{content:" ●";color:var(--acc)}
.prop .ctl{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.prop input[type=range]{flex:1;accent-color:var(--acc)}
.prop input[type=number]{width:74px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 5px;font-family:var(--mono);font-size:12px}
.prop input[type=text]{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:5px 7px}
.prop input[type=color]{width:44px;height:26px;border:1px solid var(--line);border-radius:4px;background:none;padding:0}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.list .it{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer}
.list .it:hover{background:var(--panel2)}.list .it .id{font-family:var(--mono);font-size:11px;color:var(--dim);margin-left:auto}
.dot{width:6px;height:6px;border-radius:3px;background:var(--acc);flex:none}
.empty{color:var(--dim);padding:6px 0}
.addnote{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.addnote textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px;min-height:58px;resize:vertical}
.addnote .r{display:flex;gap:8px;align-items:center;color:var(--dim);font-family:var(--mono);font-size:12px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.item .t{font-family:var(--mono);font-size:12px;color:var(--note);cursor:pointer}
.item.err .t{color:var(--err)}.item.done .txt{text-decoration:line-through;color:var(--faint)}
.item .txt{word-break:break-word}.item .rule{font-family:var(--mono);font-size:11px;color:var(--dim)}
.item .x{border:0;background:none;color:var(--faint);padding:0 4px}

/* ---- タイムライン ---- */
#bottom{grid-column:1/-1;border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;position:relative}
#resize{position:absolute;left:0;right:0;top:-3px;height:6px;cursor:ns-resize;z-index:5}
#transport{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line)}
#tc{font-family:var(--mono);font-size:13px;color:var(--fg);min-width:96px}
#tcsub{font-family:var(--mono);font-size:12px;color:var(--dim)}
#shotname{color:var(--fg);font-weight:600;margin-left:8px}
#zoomlbl{font-family:var(--mono);font-size:11px;color:var(--dim);min-width:52px;text-align:right}
#tlscroll{flex:1;overflow:auto;min-height:0;position:relative}
#tlgrid{display:grid;grid-template-columns:var(--left) minmax(0,1fr);min-width:0}
.sticky{position:sticky;top:0;z-index:3;background:var(--panel)}
#headL{border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end}
#headL .lab{height:var(--h);display:flex;align-items:center;padding:0 10px;color:var(--dim);font-size:11px}
#headL .lab.ruler{color:var(--faint);font-family:var(--mono);justify-content:space-between}
#head{display:block;width:100%;cursor:ew-resize;border-bottom:1px solid var(--line)}
#layers{border-right:1px solid var(--line)}
#lanes{display:block;width:100%}
.ly{height:var(--row);display:flex;align-items:center;gap:4px;padding-right:6px;cursor:pointer;white-space:nowrap;border-bottom:1px solid #1b1c21}
.ly{scroll-margin-top:110px}.ly:hover{background:#1b1d24}.ly.on{background:var(--selbg)}.ly.off .nm{color:var(--faint)}
.ly .tw{width:16px;text-align:center;color:var(--dim);font-size:10px;flex:none}
.ly .tw.leaf{visibility:hidden}
.ly .nm{overflow:hidden;text-overflow:ellipsis;font-size:12px}
.ly .ic{width:14px;height:14px;flex:none;border-radius:3px;font-size:9px;display:flex;align-items:center;justify-content:center;color:var(--dim);border:1px solid var(--line)}
.ly .sp{flex:1}.ly .eye{border:0;background:none;color:var(--faint);padding:0 3px;font-size:12px;visibility:hidden}
.ly:hover .eye,.ly .eye.hid{visibility:visible}.ly .eye.hid{color:var(--err)}
.help{color:var(--faint);font-size:11px;padding:4px 12px 6px;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--dim)}
/* ---- 案の見比べ ---- */
#vpanel{position:absolute;left:0;right:0;top:44px;bottom:var(--tlh,340px);z-index:20;background:var(--bg);display:none;flex-direction:column;border-bottom:1px solid var(--line)}
#vbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#vbar .t{font-weight:700}#vbar .m{color:var(--dim);font-family:var(--mono);font-size:12px}
#vbar input{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;width:140px}
#vgrid{flex:1;overflow:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-content:start}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.vcard.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.vvid{position:relative;background:#000;aspect-ratio:var(--ar,1);max-height:var(--vh,60vh);display:flex;align-items:center;justify-content:center}
.vvid video{width:100%;height:100%;object-fit:contain;display:block}
.vvid .w{position:absolute;color:var(--dim);font-size:12px}
.vvid .snd{position:absolute;right:6px;top:6px;font-size:11px;padding:2px 7px;border-radius:10px;background:#000a}
.vvid .snd.on{background:var(--acc);color:#140904;border-color:var(--acc)}
.vbody{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.vname{font-weight:700}.vnote{color:var(--dim);font-size:12px}.vdiff{font-family:var(--mono);font-size:11px;color:var(--faint);word-break:break-all}
.vbody .row{margin-top:6px}
</style></head>
<body><div id="app">
<header>
  <span class="name" id="name">motion studio</span><span class="meta" id="meta"></span>
  <span class="sp"></span><span id="job"></span>
  <button id="bUndo" title="⌘Z" disabled>元に戻す</button><button id="bRedo" title="⇧⌘Z" disabled>やり直す</button>
  <button id="bVar" title="1 つのショットの案を並べて見比べる">案</button><button id="bReview">レビュー</button><button id="bDraft">下書き</button><button id="bRender" class="pri">書き出し</button>
  <button id="bOpen" disabled>開く</button>
</header>
<div id="stage"><img id="img" alt=""><canvas id="ov"></canvas><div id="err"></div><div id="cache"></div><div id="busy">描き直し中…</div>
  <div id="hint">クリック: 外側の要素 · ダブルクリック: 中へ · ⌘クリック: 一番内側</div></div>
<aside>
  <div class="tabs"><button data-p="elem" class="on">要素</button><button data-p="params">全体</button><button data-p="notes">メモ<span class="badge" id="nNotes">0</span></button><button data-p="finds">エラー<span class="badge" id="nErr">0</span></button></div>
  <div class="pane on" id="elem"></div>
  <div class="pane" id="params"></div>
  <div class="pane" id="notes">
    <div class="addnote"><div class="r"><span id="noteAt">0.00s</span><span id="noteFor"></span> にメモ <span style="flex:1"></span><kbd>N</kbd></div>
      <textarea id="noteText" placeholder="ここが悪い、こうしたい (Claude が notes.md を読んでこの時刻だけ直す)"></textarea>
      <div class="r"><span style="flex:1"></span><button id="noteAdd" class="pri">追加</button></div></div>
    <div id="noteList"></div>
  </div>
  <div class="pane" id="finds"><div id="findList"></div></div>
</aside>
<div id="vpanel">
  <div id="vbar"><span class="t">案の見比べ</span><span class="m" id="vrange"></span>
    <button id="vPlay" class="pri">頭から全部再生</button><button id="vStop">全部止める</button><button id="vRender">全案を書き出す</button>
    <span style="flex:1"></span>
    <input id="vName" placeholder="案の名前"><input id="vNote" placeholder="ねらい (任意)"><button id="vAdd" title="今の全体のパラメータ (tune.json) を案として足す">今の状態を案に加える</button>
    <button id="vClose" class="ghost">閉じる (Esc)</button></div>
  <div id="vgrid"></div>
</div>
<div id="bottom"><div id="resize" title="ドラッグで高さを変える"></div>
  <div id="transport"><button id="bPlay" title="Space">▶</button><button id="bPrev" title="←">◀︎</button><button id="bNext" title="→">▶︎</button>
    <span id="tc">0.00s</span><span id="tcsub"></span><span id="shotname"></span><span style="flex:1"></span>
    <button class="ghost sm" id="zOut" title="縮小">−</button><span id="zoomlbl">全体</span><button class="ghost sm" id="zIn" title="拡大">＋</button><button class="ghost sm" id="zFit">全体を表示</button>
    <label style="color:var(--dim);font-size:12px;margin-left:8px"><input type="checkbox" id="loopChk" checked> ループ</label></div>
  <div id="tlscroll"><div id="tlgrid">
    <div id="headL" class="sticky"></div><canvas id="head" class="sticky"></canvas>
    <div id="layers"></div><canvas id="lanes"></canvas>
  </div></div>
  <div class="help">上の目盛り・波形をドラッグでシーク (<kbd>⇧</kbd> 拍に吸着) · <kbd>⌘</kbd>+ホイール / ピンチで拡大 · ホイール横 / <kbd>⇧</kbd>+ホイールで左右に移動 · バーをドラッグで出の時刻をずらす · <kbd>Space</kbd> 再生 · <kbd>←</kbd><kbd>→</kbd> 1 フレーム (<kbd>⇧</kbd> 1 拍) · <kbd>[</kbd><kbd>]</kbd> ショット · <kbd>⌥</kbd>+矢印 要素を 1px · <kbd>Esc</kbd> 親へ · <kbd>N</kbd> メモ · <kbd>⌘Z</kbd>/<kbd>⇧⌘Z</kbd></div>
</div>
</div>
<audio id="aud" preload="auto"></audio>
<script>
const $=id=>document.getElementById(id);
let I=null,ver=-1,cur=0,playing=false,inflight=false,pending=null,t0=0,f0=0;
let NODES=[],nodesKey='',sel=null,hover=null,drag=null,undo=[],redo=[];
const open_=new Set();   // 開いているレイヤー
const img=$('img'),aud=$('aud'),ov=$('ov'),octx=ov.getContext('2d'),head=$('head'),hctx=head.getContext('2d'),lanesC=$('lanes'),lctx=lanesC.getContext('2d');
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=t=>t.toFixed(2)+'s';
const tNow=()=>cur/(I?I.fps:60);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function post(u,b){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json())}

// ================= 再生
function show(f){if(!I)return;f=Math.max(0,Math.min(I.nframes-1,Math.round(f)));cur=f;const t=f/I.fps;
  $('tc').textContent=fmt(t);$('tcsub').textContent=`#${f}  ${Math.floor(t/(240/I.bpm))+1}小節 ${Math.floor(t/(60/I.bpm))%4+1}拍`;
  const s=(I.shots||[]).find(s=>s.start<=t&&t<s.end);$('shotname').textContent=s?s.name:'';
  $('noteAt').textContent=fmt(t);followPlayhead();drawTL();
  if(inflight){pending=f;return}inflight=true;const im=new Image();
  im.onload=()=>{img.src=im.src;inflight=false;$('busy').style.display='none';if(pending!==null){const p=pending;pending=null;show(p)}else if(!playing)loadNodes()};
  im.onerror=()=>{inflight=false;setTimeout(()=>show(cur),200)};im.src=`/frame/${f}.jpg?v=${ver}`}
let audioKey=null;
async function loadAudio(key){audioKey=key;const b=await (await fetch('/audio.wav?k='+encodeURIComponent(key))).blob();
  if(key!==audioKey)return;const old=aud.src;aud.src=URL.createObjectURL(b);if(old.startsWith('blob:'))URL.revokeObjectURL(old)}
function tick(){if(!playing)return;const clock=f0/I.fps+(performance.now()-t0)/1000;
  // 音声の位置が映像の時計から大きく外れたら (読み込み途中・シーク失敗) 時計を優先する
  let t=aud.src&&!aud.paused&&Math.abs(aud.currentTime-clock)<0.25?aud.currentTime:clock;
  let f=Math.round(t*I.fps);if(f>=I.nframes){if(!$('loopChk').checked){toggle();return}f=0;t0=performance.now();f0=0;if(aud.src)aud.currentTime=0}
  if(f!==cur)show(f);requestAnimationFrame(tick)}
function toggle(){playing=!playing;$('bPlay').textContent=playing?'❚❚':'▶';
  if(playing&&!$('loopChk').checked&&cur>=I.nframes-1)show(0);
  if(playing){NODES=[];drawOV();t0=performance.now();f0=cur;if(aud.src){aud.currentTime=cur/I.fps;aud.loop=$('loopChk').checked;aud.play().catch(()=>{})}requestAnimationFrame(tick)}
  else{aud.pause();loadNodes()}}
function seekTo(f){show(f);if(playing){f0=cur;t0=performance.now();if(aud.src)aud.currentTime=cur/I.fps}}

// ================= 要素の木
const N=()=>(I&&I.nodes)||{};
function parentOf(id){const n=NODES.find(x=>x.id===id);return n?n.parent:(N()[id]||{}).parent||null}
function chainOf(id){const c=[];while(id){c.unshift(id);id=parentOf(id)}return c}
function labelOf(id){const n=NODES.find(x=>x.id===id);return n?n.label:(N()[id]||{}).label||id}
function childrenOf(id){return Object.keys(N()).filter(k=>(N()[k].parent||null)===id).sort((a,b)=>N()[a].seen[0]-N()[b].seen[0])}
function visibleRows(){const out=[];const walk=(pid,d)=>childrenOf(pid).forEach(id=>{out.push([id,d]);if(open_.has(id))walk(id,d+1)});walk(null,0);return out}
function reveal(id){chainOf(id).slice(0,-1).forEach(a=>open_.add(a))}

// ================= 映像の上の要素
function imgRect(){const W=ov.clientWidth,H=ov.clientHeight;if(!I)return{x:0,y:0,w:W,h:H};const a=I.width/I.height;
  let w=W,h=W/a;if(h>H){h=H;w=H*a}return{x:(W-w)/2,y:(H-h)/2,w,h}}
const px=(n,R)=>({l:R.x+n.box[0]*R.w,t:R.y+n.box[1]*R.h,r:R.x+n.box[2]*R.w,b:R.y+n.box[3]*R.h,ox:R.x+n.origin[0]*R.w,oy:R.y+n.origin[1]*R.h});
async function loadNodes(){if(!I||playing)return;const key=ver+':'+cur;if(key===nodesKey)return;nodesKey=key;
  const f=cur;try{const r=await (await fetch(`/nodes/${f}?v=${ver}`)).json();if(f!==cur)return;NODES=r;drawOV();buildElem();buildLayers()}catch(e){}}
function selNode(){return NODES.find(n=>n.id===sel)}
function handles(b){return{tl:[b.l,b.t],tr:[b.r,b.t],bl:[b.l,b.b],br:[b.r,b.b],rot:[(b.l+b.r)/2,b.t-26]}}
// クリックした点を含む一番内側の要素から、外側までの鎖
function hitChain(x,y){const R=imgRect();let best=null,ba=1e18;for(const n of NODES){const b=px(n,R);if(x>=b.l&&x<=b.r&&y>=b.t&&y<=b.b){const a=(b.r-b.l)*(b.b-b.t);if(a<ba){ba=a;best=n}}}
  return best?chainOf(best.id).filter(id=>NODES.some(n=>n.id===id)):[]}
// Figma と同じ: 普段は一番外側。選んでいる要素の中や兄弟なら、その階層のまま
function pick(chain,mode){if(!chain.length)return null;if(mode==='deep')return chain[chain.length-1];
  if(sel){const i=chain.indexOf(sel);if(i>=0)return mode==='in'?chain[Math.min(i+1,chain.length-1)]:sel;
    const sc=chainOf(sel);let d=0;while(d<sc.length&&d<chain.length&&sc[d]===chain[d])d++;
    if(d>0)return chain[Math.min(d,chain.length-1)]}
  return mode==='in'?chain[Math.min(1,chain.length-1)]:chain[0]}
function drawOV(){const dpr=devicePixelRatio||1,W=ov.clientWidth,H=ov.clientHeight;if(ov.width!==W*dpr||ov.height!==H*dpr){ov.width=W*dpr;ov.height=H*dpr}
  octx.setTransform(dpr,0,0,dpr,0,0);octx.clearRect(0,0,W,H);if(!I)return;const R=imgRect();
  // 別々の要素の文字が重なるコマは赤で囲む (時刻をずらした結果の重なりに、調整の最中に気づけるように)

    r.innerHTML=`<span class="tw${kids?'':' leaf'}">${open_.has(id)?'▾':'▸'}</span><span class="ic">${v.parent?'':'■'}</span><span class="nm">${esc(v.label.split(': ').pop())}</span>${E[id]?'<span class="dot" title="変更あり"></span>':''}<span class="sp"></span><button class="eye${E[id]&&E[id].hidden?' hid':''}" title="隠す / 表示">${E[id]&&E[id].hidden?'⊘':'👁'}</button>`;
    r.querySelector('.tw').onclick=ev=>{ev.stopPropagation();open_.has(id)?open_.delete(id):open_.add(id);buildLayers();drawTL()};
    r.querySelector('.eye').onclick=ev=>{ev.stopPropagation();edit(id,{hidden:(E[id]&&E[id].hidden)?null:true})};
    r.onclick=()=>{goTo(id);select(id)};r.onmouseenter=()=>{hover=id;drawOV()};r.onmouseleave=()=>{hover=null;drawOV()};
    $('layers').append(r)});drawLanes();
  if(sel&&sel!==shownSel){shownSel=sel;const r=$('layers').querySelector(`.ly[data-id="${CSS.escape(sel)}"]`);if(r)r.scrollIntoView({block:'nearest'})}}
let shownSel=null;
function markLayer(){document.querySelectorAll('.ly').forEach(r=>r.style.outline=r.dataset.id===hover?'1px solid #ffffff44':'')}
function drawLanes(){const rows=visibleRows(),rh=22,dpr=devicePixelRatio||1,W=tlW(),H=Math.max(rows.length*rh,1);lanesC.style.height=H+'px';
  if(lanesC.width!==W*dpr||lanesC.height!==H*dpr){lanesC.width=W*dpr;lanesC.height=H*dpr}
  const c=lctx;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);const E=I.edits||{},beat=60/I.bpm;
  for(let t=Math.floor(vs/beat)*beat;t<=vs+VD();t+=beat){const x=Math.round(t2x(t))+.5;c.strokeStyle='#1d1f25';c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}
  rows.forEach(([id],i)=>{const v=N()[id],y=i*rh,on=id===sel;if(on){c.fillStyle='#16233a';c.fillRect(0,y,W,rh)}
    const sh=(drag&&drag.mode==='lane'&&drag.id===id)?drag.dts:0;let last=0;
    c.fillStyle=on?css('--sel'):(E[id]?'#8a5236':(v.parent?'#343a4c':'#43506e'));
    (v.runs||[v.seen]).forEach(([a,b])=>{const x0=t2x(a+sh),x1=t2x(b+sh);c.beginPath();c.roundRect(x0,y+4,Math.max(x1-x0,3),rh-8,3);c.fill();last=Math.max(last,b+sh)});
    if(E[id]&&E[id].dt&&!sh&&last>vs){c.fillStyle=css('--acc');c.font='10px '+css('--mono');c.textBaseline='middle';c.fillText(`${E[id].dt>0?'+':''}${E[id].dt.toFixed(2)}s`,Math.min(t2x(last)+5,W-48),y+rh/2)}
    if(sh){c.fillStyle='#fff';c.font='10px '+css('--mono');c.textBaseline='middle';c.fillText(`${sh>0?'+':''}${sh.toFixed(3)}s`,Math.min(t2x(last)+5,W-56),y+rh/2)}});
  const x=t2x(tNow());c.fillStyle=css('--acc');c.fillRect(x-1,0,2,H)}
function drawTL(){if(!I)return;drawHead();drawLanes()}
// シーク: 目盛り・ショット・波形・マーカーの帯のどこでも。再生ヘッドは下のレイヤーの帯でもつかめる
function scrubAt(e){const r=head.getBoundingClientRect();let t=x2t(e.clientX-r.left);if(e.shiftKey){const b=60/I.bpm;t=Math.round(t/b)*b}
  seekTo(Math.max(0,Math.min(I.nframes-1,Math.round(t*I.fps))))}
head.onmousedown=e=>{if(!I)return;drag={mode:'scrub'};scrubAt(e)};
lanesC.onmousedown=e=>{if(!I)return;const r=lanesC.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(Math.abs(x-t2x(tNow()))<5){drag={mode:'scrub'};scrubAt(e);return}
  const rows=visibleRows(),i=Math.floor(y/22);if(i<0||i>=rows.length)return;const id=rows[i][0],v=N()[id],t=x2t(x);
  if((v.runs||[v.seen]).some(([a,b])=>t>=a&&t<=b)){if(id!==sel)select(id);drag={id,mode:'lane',x0:x,dts:0,base:((I.edits||{})[id]||{}).dt||0,moved:false};return}
  drag={mode:'scrub'};scrubAt(e)};
lanesC.onmousemove=e=>{if(drag)return;const r=lanesC.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;const rows=visibleRows(),i=Math.floor(y/22);
  let cur_='crosshair';if(Math.abs(x-t2x(tNow()))<5)cur_='ew-resize';else if(i>=0&&i<rows.length){const v=N()[rows[i][0]],t=x2t(x);if((v.runs||[v.seen]).some(([a,b])=>t>=a&&t<=b))cur_='grab'}lanesC.style.cursor=cur_};
function laneMove(e){const r=lanesC.getBoundingClientRect();let d=(e.clientX-r.left-drag.x0)/tlW()*VD();
  const b=1/I.fps;d=Math.round(d/b)*b;if(e.shiftKey){const q=60/I.bpm/4;d=Math.round(d/q)*q}if(Math.abs(d)>0)drag.moved=true;drag.dts=d;drawLanes()}
addEventListener('mousemove',e=>{if(!drag)return;if(drag.mode==='scrub')scrubAt(e);else if(drag.mode==='lane')laneMove(e)});
addEventListener('mouseup',e=>{if(!drag)return;if(drag.mode==='scrub'){drag=null;return}
  if(drag.mode==='lane'){laneMove(e);const d=drag;drag=null;if(d.moved&&Math.abs(d.dts)>1e-6)edit(d.id,{dt:+(d.base+d.dts).toFixed(4)});else drawLanes()}});
$('tlscroll').addEventListener('wheel',e=>{if(!I)return;const r=head.getBoundingClientRect();
  if(e.ctrlKey||e.metaKey){e.preventDefault();const t=x2t(e.clientX-r.left);zoomAt(Math.exp(-e.deltaY*0.01),t);return}
  const dx=e.shiftKey?e.deltaY:e.deltaX;if(Math.abs(dx)>Math.abs(e.shiftKey?0:e.deltaY)&&vd){e.preventDefault();vs+=dx/tlW()*VD();clampView();drawTL()}},{passive:false});
$('zIn').onclick=()=>zoomAt(2,tNow());$('zOut').onclick=()=>zoomAt(.5,tNow());$('zFit').onclick=()=>{vd=null;vs=0;clampView();drawTL()};
head.ondblclick=()=>$('zFit').click();
// タイムラインの高さ
$('resize').onmousedown=e=>{const y0=e.clientY,h0=$('bottom').getBoundingClientRect().height;const mv=ev=>{const h=Math.max(160,Math.min(innerHeight-200,h0-(ev.clientY-y0)));document.getElementById('app').style.setProperty('--tlh',h+'px');drawOV();drawTL()};
  const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};addEventListener('mousemove',mv);addEventListener('mouseup',up)};

// ================= メモとエラー
function buildNotes(){const el=$('noteList');el.innerHTML='';const Ns=I.notes||[];$('nNotes').textContent=Ns.filter(n=>!n.done).length;
  if(!Ns.length)el.innerHTML='<div class="empty">メモはまだ無い。気になるコマで N を押して書く。</div>';
  Ns.forEach(n=>{const d=document.createElement('div');d.className='item'+(n.done?' done':'');
    d.innerHTML=`<span class="t">${fmt(n.t)}</span><span class="txt"></span><span><input type="checkbox" title="済み" ${n.done?'checked':''}><button class="x" title="削除">✕</button></span>`;
    d.querySelector('.txt').textContent=n.text;d.querySelector('.t').onclick=()=>seekTo(n.t*I.fps);
    d.querySelector('input').onchange=e=>post('/notes/update',{id:n.id,done:e.target.checked}).then(poll1);
    d.querySelector('.x').onclick=()=>post('/notes/update',{id:n.id,delete:true}).then(poll1);el.append(d)})}
function buildFinds(){const el=$('findList');el.innerHTML='';const F=I.findings||[];const b=$('nErr');b.textContent=F.length;b.className='badge'+(F.length?' err':'');
  if(!F.length)el.innerHTML='<div class="empty">最新のレビューでエラーは 0 件。</div>';
  F.forEach(f=>{const d=document.createElement('div');d.className='item err';d.innerHTML=`<span class="t">${fmt(f.t)}</span><span><div class="rule"></div><div class="txt"></div></span><span></span>`;
    d.querySelector('.rule').textContent=f.rule;d.querySelector('.txt').textContent=f.detail;d.querySelector('.t').onclick=()=>seekTo(f.t*I.fps);el.append(d)})}
function addNote(){let t=$('noteText').value.trim();if(!t)return;if(sel)t=`[${sel}] `+t;post('/notes/add',{t:+tNow().toFixed(2),text:t}).then(()=>{$('noteText').value='';poll1()})}
$('noteAdd').onclick=addNote;$('noteText').onkeydown=e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();addNote()}if(e.key==='Escape')e.target.blur()};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.pane').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.p).classList.add('on')});
const tab=p=>document.querySelector(`.tabs button[data-p=${p}]`).click();

// ================= ジョブ
$('bReview').onclick=()=>post('/review').then(poll1);$('bDraft').onclick=()=>post('/render',{draft:true}).then(poll1);
$('bRender').onclick=()=>post('/render',{draft:false}).then(poll1);$('bOpen').onclick=()=>post('/open');
let lastJob='';
function showJob(j){const e=$('job');['bReview','bDraft','bRender'].forEach(id=>$(id).disabled=j.running);if(!j.name){e.textContent='';return}
  e.className=j.running?'run':(j.code===0?'good':'bad');e.textContent=j.running?`${j.name}: ${j.last}`:`${j.name}: ${j.code===0?'完了':'失敗'}  ${j.last}`;
  const key=j.name+j.running+j.code;if(lastJob&&key!==lastJob&&!j.running&&j.name==='レビュー')tab('finds');
  if(lastJob&&key!==lastJob&&!j.running&&j.name==='案の書き出し'&&vOpen())loadVariants();lastJob=key;$('bOpen').disabled=!I.output;$('vRender').disabled=j.running}

// ================= 案の見比べ
let VS=null,vurls={},vsound=0;
const vOpen=()=>$('vpanel').style.display==='flex';
async function loadVariants(){VS=await (await fetch('/variants')).json();buildVariants()}
function vdiff(v){const a=Object.entries(v.tune||{}).map(([k,x])=>`${k}=${JSON.stringify(x)}`),b=Object.entries(v.params||{}).map(([k,x])=>`--set ${k}=${JSON.stringify(x)}`);return [...b,...a].join('  ')}
function vids(){return [...document.querySelectorAll('#vgrid video')]}
function buildVariants(){const g=$('vgrid');g.innerHTML='';vids().forEach(v=>v.pause());
  if(!VS.exists||!VS.variants.length){$('vrange').textContent='';
    g.innerHTML=`<div class="empty" style="grid-column:1/-1">案はまだ無い。<br>・右上の欄に名前を入れて「今の状態を案に加える」と、今の全体のパラメータが 1 案になる (区間は今のショット)。値を変えてもう一度押すと 2 案目。<br>・または Claude に「この区間で案を 4 つ作って」と頼むと、<code>${esc(VS.file)}</code> に書く。<br>案ができたら「全案を書き出す」で下書きを作り、ここで横に並べて同時に見比べる。</div>`;return}
  $('vrange').textContent=`${VS.start.toFixed(2)}–${VS.end.toFixed(2)}s · ${VS.variants.length} 案${VS.chosen?` · 選んだ案: ${VS.chosen}`:''}`;
  g.style.setProperty('--ar',I?I.width/I.height:1);vFit();
  VS.variants.forEach(v=>{const d=document.createElement('div');d.className='vcard'+(VS.chosen===v.name?' on':'');
    d.innerHTML=`<div class="vvid"><video muted playsinline preload="auto"></video><div class="w">${v.mtime?'読み込み中…':'未書き出し (「全案を書き出す」)'}</div><button class="snd sm">音</button></div>
      <div class="vbody"><div class="vname"></div><div class="vnote"></div><div class="vdiff"></div>
      <div class="row"><button class="sm ch">${VS.chosen===v.name?'選んだ案 (取り消す)':'これにする'}</button></div></div>`;
    d.querySelector('.vname').textContent=v.name;d.querySelector('.vnote').textContent=v.note||'';d.querySelector('.vdiff').textContent=vdiff(v)||'(差分なし)';
    const vid=d.querySelector('video'),w=d.querySelector('.w'),snd=d.querySelector('.snd');
    vid.loop=true;vid.muted=v.i!==vsound;snd.classList.toggle('on',v.i===vsound);
    snd.onclick=()=>{vsound=v.i;vids().forEach((x,j)=>x.muted=j!==v.i);document.querySelectorAll('.vvid .snd').forEach((x,j)=>x.classList.toggle('on',j===v.i))};
    d.querySelector('.ch').onclick=async()=>{VS=await post('/variants/choose',{name:VS.chosen===v.name?null:v.name});buildVariants()};
    if(v.mtime){const key=v.i+':'+v.mtime;
      (vurls[key]?Promise.resolve(vurls[key]):fetch(`/variants/clip/${v.i}.mp4?m=${v.mtime}`).then(r=>r.blob()).then(b=>vurls[key]=URL.createObjectURL(b)))
        .then(u=>{vid.src=u;w.style.display='none'})}
    g.append(d)})}
function vPlayAll(){const vs=vids().filter(v=>v.src);vs.forEach(v=>{v.currentTime=0});Promise.all(vs.map(v=>v.play().catch(()=>{})))}
// 案ごとに再生の進みがずれるので、最初の案に揃え続ける
setInterval(()=>{if(!vOpen())return;const vs=vids().filter(v=>v.src&&!v.paused);if(vs.length<2)return;const m=vs[0].currentTime;vs.slice(1).forEach(v=>{if(Math.abs(v.currentTime-m)>0.05)v.currentTime=m})},250);
// 名前と「これにする」が下にはみ出さないよう、映像の高さをパネルに収める
function vFit(){const g=$('vgrid');g.style.setProperty('--vh',Math.max(140,g.clientHeight-28-120)+'px')}
addEventListener('resize',()=>{if(vOpen())vFit()});
$('bVar').onclick=()=>{if(playing)toggle();$('vpanel').style.display='flex';loadVariants()};
$('vClose').onclick=()=>{vids().forEach(v=>v.pause());$('vpanel').style.display='none'};
$('vPlay').onclick=vPlayAll;$('vStop').onclick=()=>vids().forEach(v=>v.pause());
$('vRender').onclick=()=>post('/variants/render').then(poll1);
$('vAdd').onclick=async()=>{const name=$('vName').value.trim();if(!name){$('vName').focus();return}
  const t=tNow(),sh=(I.shots||[]).find(s=>s.start<=t&&t<s.end)||{start:Math.max(0,t-1),end:Math.min(I.duration,t+1)};
  VS=await post('/variants/add',{name,note:$('vNote').value.trim(),start:sh.start,end:sh.end});$('vName').value='';$('vNote').value='';buildVariants()};

// ================= 状態の取得
let sig='';
async function poll1(){try{const j=await (await fetch('/info')).json();
  const e=$('err');e.style.display=j.error?'block':'none';e.textContent=j.error||'';$('cache').style.width=(100*j.cached/j.nframes)+'%';
  if(j.version!==ver){const first=!I;I=j;ver=j.version;nodesKey='';$('name').textContent=j.name;
    $('meta').textContent=`${j.width}×${j.height} · ${j.fps}fps · ${j.duration?.toFixed?.(1)}s · ${j.bpm} BPM${j.loop?' · ループ':''}`;
    if(j.audio&&j.audio_key!==audioKey)loadAudio(j.audio_key);if(first)buildHeadL();buildParams();clampView();show(first?0:cur)}
  else{const keepEdits=I.edits;I=Object.assign(I,j);if(!j.edits)I.edits=keepEdits}
  const s=JSON.stringify([j.notes,j.findings,j.nodes,j.edits]);if(s!==sig){sig=s;buildNotes();buildFinds();buildLayers();drawTL();if(!sel)buildElem()}
  if(j.job)showJob(j.job)}catch(e){}}
async function poll(){await poll1();setTimeout(poll,400)}

document.addEventListener('focusin',e=>{if(e.target.matches('input'))e.target.dataset.orig=e.target.type==='checkbox'?e.target.checked:e.target.value});
document.onkeydown=e=>{const mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();
  if(mod&&(k==='z'||k==='y')){const t=e.target,typing=t.id==='noteText'||(t.matches('input[type=text],input[type=number]')&&t.value!==t.dataset.orig);
    if(!typing){e.preventDefault();if(t.matches('input'))t.blur();(k==='y'||e.shiftKey)?doRedo():doUndo();return}}
  // チェックボックスやボタンにフォーカスが残っていても、Space や矢印はブラウザの既定動作に渡さない
  if(e.target.matches('textarea,input:not([type=checkbox])'))return;if(!I)return;const beat=Math.round(I.fps*60/I.bpm);
  if(e.altKey&&sel&&e.key.startsWith('Arrow')){e.preventDefault();const n=selNode();if(!n)return;const st=e.shiftKey?10:1,b=base(n);
    const u=e.key==='ArrowLeft'?{dx:b.dx-st}:e.key==='ArrowRight'?{dx:b.dx+st}:e.key==='ArrowUp'?{dy:b.dy-st}:{dy:b.dy+st};n.edits=Object.assign({},n.edits,u);edit(n.id,u);return}
  if(vOpen()){if(e.key==='Escape')$('vClose').click();else if(e.code==='Space'){e.preventDefault();const vs=vids().filter(v=>v.src);vs.some(v=>!v.paused)?vs.forEach(v=>v.pause()):vPlayAll()}return}
  if(e.code==='Space'){e.preventDefault();e.target.blur?.();toggle()}else if(e.key==='Escape'){select(sel?parentOf(sel):null)}
  else if(e.key==='Enter'&&sel){const k2=childrenOf(sel)[0];if(k2)select(k2)}
  else if(e.code==='ArrowLeft')seekTo(cur-(e.shiftKey?beat:1));else if(e.code==='ArrowRight')seekTo(cur+(e.shiftKey?beat:1));
  else if(e.key==='['||e.key===']'){const t=tNow(),S=I.shots||[];const s=e.key===']'?S.find(s=>s.start>t+1e-3):[...S].reverse().find(s=>s.start<t-1e-3);if(s)seekTo(s.start*I.fps)}
  else if(e.key==='n'||e.key==='N'){e.preventDefault();if(playing)toggle();tab('notes');$('noteText').focus()}};
$('bPlay').onclick=toggle;$('bPrev').onclick=()=>seekTo(cur-1);$('bNext').onclick=()=>seekTo(cur+1);
addEventListener('resize',()=>{drawOV();drawTL()});
$('loopChk').onchange=e=>{aud.loop=e.target.checked;e.target.blur()};
document.querySelectorAll('#transport button').forEach(b=>b.onmousedown=e=>e.preventDefault());
new ResizeObserver(()=>{drawOV();drawTL()}).observe($('stage'));
poll();
</script></body></html>
