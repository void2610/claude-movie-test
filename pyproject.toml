[project]
name = "claude-movie-test"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "librosa>=1.0.0",
    "manimgx>=0.1.1 ; python_full_version >= '3.13'",
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
    "pedalboard>=0.9.25",
    "pyloudnorm>=0.2.0",
    "scipy>=1.18.1",
    "skia-python>=144.0.post2",
    "torch>=2.14.1",
    "transformers>=5.20.1",
    "uharfbuzz>=0.56.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
